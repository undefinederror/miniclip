name: miniclip
title: Miniclip
version: '1.1.2'
icon: icon.png
summary: A simple clipboard manager for Linux
description: |
  A minimal, simple, modern clipboard manager for Linux (Wayland/X11), built with Electron and React.
  
  Features
  - **Modern UI**: Clean, GNOME-inspired design with system theme support.
  - **In-Memory History**: Stores text-only clipboard entries during your current session.
  - **Image support**: Stores both text and screenshots.
  
  
  Usage
  
  Miniclip monitors your clipboard and stores a history of entries.
  - **Arrows**: Move across items in the list.
  - **Enter**: Copy an item back to the clipboard.
  - **Delete**: Remove an item.
  - **Filter**: Find a specific item.
  
  By default, Miniclip starts hidden in the system tray. To show the window, click the tray icon or run:
  `miniclip show`
  
  Global Shortcut (Wayland & X11)
  
  Due to security limitations in modern display servers like **Wayland**, applications are often restricted from registering global keybindings while they don't have focus. 
  
  This is why it is recommend setting up a system-level shortcut. This ensures the best performance and compatibility with your desktop environment.
  
  Setting up a shortcut in GNOME
  1. Open **Settings** -> **Keyboard** -> **View and Customize Shortcuts**.
  2. Go to **Custom Shortcuts** -> **Add Shortcut**.
  3. **Name**: `Miniclip Show`
  4. **Command**: `miniclip show`
  5. **Shortcut**: Your preferred combo (e.g., `Super+V` or `Ctrl+Alt+G`).

grade: stable
license: GPL-3.0
confinement: strict
base: core22
issues: https://github.com/undefinederror/miniclip/issues
source-code: https://github.com/undefinederror/miniclip

platforms:
  amd64:
    build-on:
      - amd64
    build-for:
      - amd64

plugs:
  shmem:
    interface: shared-memory
    private: true

parts:
  miniclip:
    plugin: nil
    source: .
    override-build: |
      sudo snap install node --classic --channel 20
      export PATH="/snap/bin:$PATH"
      export ELECTRON_SKIP_BINARY_DOWNLOAD=1
      npm install
      npm run build
      mkdir -p $SNAPCRAFT_PART_INSTALL/share/miniclip
      
      # Find the latest release directory and copy its contents
      LATEST_RELEASE=$(ls -dt release/*/ | head -n1)
      if [ -d "$LATEST_RELEASE/linux-unpacked" ]; then
        cp -r "$LATEST_RELEASE/linux-unpacked"/* $SNAPCRAFT_PART_INSTALL/
      else
        echo "Error: linux-unpacked directory not found in $LATEST_RELEASE"
        exit 1
      fi
      
      # Remove chrome-sandbox as it's unnecessary in simple Electron apps
      rm -f $SNAPCRAFT_PART_INSTALL/chrome-sandbox
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
      cp miniclip.desktop $SNAPCRAFT_PART_INSTALL/usr/share/applications/

apps:
  miniclip:
    extensions: [gnome]
    command: miniclip
    desktop: usr/share/applications/miniclip.desktop
    environment:
      TMPDIR: $XDG_RUNTIME_DIR
      DISABLE_WAYLAND: 1
      ELECTRON_DISABLE_SANDBOX: 1
    plugs:
      - home
      - desktop
      - shmem
      - system-observe
